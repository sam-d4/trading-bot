[project]
name = "trading-bot"
version = "0.1.0"
description = "Personal FOREX trading bot (OANDA) with a pretrained, self-improving RL strategy layer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "oandapyV20>=0.7.2",
    "requests>=2.32",
    "pandas>=2.2",
    # torch's last x86_64-macOS wheel (2.2.2) was built against NumPy 1.x's C ABI and breaks
    # silently ("_ARRAY_API not found") under NumPy 2.x - capping avoids that ABI mismatch. Fine
    # to keep even on platforms with newer torch wheels; nothing here needs NumPy 2-only features.
    "numpy>=1.26,<2",
    "pyarrow>=17.0",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "websockets>=13.1",
]

[project.optional-dependencies]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    # PyTorch dropped Intel-mac wheel builds after 2.2.x; unpinned here so dev (Intel Mac) and
    # the Linux VPS deployment can each resolve to whatever's available for their platform.
    "torch>=2.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: drives real PyTorch training - excluded by default, run with -m slow"]
addopts = "-m 'not slow'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
